<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ironlog</title>
<meta name="description" content="Ironlog — a smart, fast workout tracker.">
<meta name="theme-color" content="#0d1219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironlog">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --line:#dde3ea;
  --ink:#141b24; --ink-2:#4a5967; --ink-3:#8695a4;
  --accent:#f5511e; --accent-ink:#ffffff; --accent-soft:#fde7de;
  --good:#12915c; --good-soft:#dcf1e7; --warn:#b8860b;
  --shadow:0 1px 2px rgba(20,27,36,.06),0 6px 20px rgba(20,27,36,.06);
  --radius:16px; --radius-sm:11px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1219; --surface:#161d27; --surface-2:#1d2632; --line:#2a3441;
    --ink:#e9eef4; --ink-2:#a7b4c2; --ink-3:#6f7e8e;
    --accent:#ff6337; --accent-ink:#160a05; --accent-soft:#3a1d12;
    --good:#34c184; --good-soft:#123227; --warn:#e0a93a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1219; --surface:#161d27; --surface-2:#1d2632; --line:#2a3441;
  --ink:#e9eef4; --ink-2:#a7b4c2; --ink-3:#6f7e8e;
  --accent:#ff6337; --accent-ink:#160a05; --accent-soft:#3a1d12;
  --good:#34c184; --good-soft:#123227; --warn:#e0a93a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
/* Kill iOS Safari's double-tap-to-zoom (the cause of the screen "zooming in" when tapping the +/-
   steppers quickly) while still allowing normal panning and pinch-zoom-out for accessibility. */
html{touch-action:manipulation}
/* Contain rubber-band overscroll so the page doesn't bounce/reveal odd background at the top/bottom
   edges — set on both html and body since which one is "the" scrolling element is inconsistent
   across engines. */
html,body{overscroll-behavior-y:contain}
[hidden]{display:none!important}
body{
  /* min-height keeps short screens' background filling the true viewport instead of stopping at
     the content's own height — plain vh/dvh fallbacks first, then --vvh (JS-measured
     window.visualViewport height, kept live by ui.js) once it's set, for the best value available
     in whichever engine is rendering. This is cosmetic polish only, NOT what positions the tab bar
     (see .tabbar below) — deliberately decoupled, because inside an embedded WKWebView (the Claude
     iOS app's Artifact renderer) neither dvh nor visualViewport can be trusted to be correct at any
     knowable moment: WebKit bug 191872 documents env(safe-area-inset-*) / viewport metrics staying
     wrong until an arbitrary, undeterminable point after load — confirmed on-device here as "wrong
     on every tab until the user happens to visit one long enough to scroll, then correct everywhere
     from then on." No JS-only trick reliably forces that native correction, so the tab bar's own
     position must not depend on measuring it at all. */
  min-height:100vh; min-height:100dvh; min-height:var(--vvh,100vh);
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5; font-size:14px;
  padding-bottom:calc(74px + var(--safe-b));
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select{font-family:inherit}
h1,h2,h3{margin:0; text-wrap:balance; font-family:"Archivo",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:520px; margin:0 auto; padding:0 16px}

/* Header */
.app-head{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 86%,transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.app-head .wrap{display:flex; align-items:center; justify-content:space-between; height:56px}
.brand{font-family:"Archivo"; font-weight:800; font-size:20px; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
.brand .spark{width:10px;height:22px;background:var(--accent);border-radius:2px;transform:skewX(-12deg)}
.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--surface-2)}
.view-title{font-family:"Archivo";font-weight:800;font-size:15px;letter-spacing:-.01em}

/* Tab bar */
/* position:fixed, not sticky — deliberately anchored straight to the viewport rather than derived
   from body/flex height, which is exactly the measurement that's unreliable inside an embedded
   WKWebView (see the body rule above). Fixed elements aren't affected by that: WebKit tracks their
   edge independently of the buggy env()/visualViewport timing. The classic "fixed bottom bar jumps
   as Safari's address bar auto-hides" issue this originally avoided doesn't apply to this app's
   actual delivery contexts either way — the Claude iOS app's WKWebView and an installed standalone
   PWA (display:standalone) both have no address bar to begin with. */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar .row{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.01em}
.tab svg{width:23px;height:23px}
.tab.active{color:var(--accent)}

/* Generic */
.section{padding:18px 0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:13px;font-weight:600;font-size:15px;background:var(--surface);border:1px solid var(--line);color:var(--ink);transition:transform .05s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:#d33a26;color:#fff;border-color:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{height:40px;font-size:14px;padding:0 14px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips.hscroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.hscroll::-webkit-scrollbar{display:none}
.chips.hscroll .chip{flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* Inputs */
.field{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 15px;font-size:16px}
.field:focus{outline:none;border-color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:0 14px;height:50px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:none;background:none;height:100%;font-size:16px;color:var(--ink)}
.search input:focus{outline:none}
.search svg{width:19px;height:19px;color:var(--ink-3)}

/* Exercise rows */
.ex-row{display:flex;align-items:center;gap:13px;padding:13px 15px;border-bottom:1px solid var(--line)}
.ex-row:last-child{border-bottom:none}
.ex-ic{width:42px;height:42px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;color:var(--accent)}
.ex-ic svg{width:22px;height:22px}
.ex-name{font-weight:600;font-size:15px;line-height:1.25}
.ex-sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.ex-add{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}

/* Set logging */
.log-ex{margin-bottom:14px;overflow:hidden}
.log-ex-head{display:flex;align-items:center;gap:11px;padding:13px 15px 11px}
.log-ex-head .ex-ic{width:38px;height:38px}
.setgrid{padding:0 12px 6px}
.set-hdr,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:9px;align-items:center}
.set-hdr{padding:2px 4px 8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.set-hdr div:nth-child(2),.set-hdr div:nth-child(3){text-align:center}
.set-row{margin-bottom:9px}
.set-no{width:34px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--ink-2);font-family:"IBM Plex Mono";font-size:14px}
.set-row.done .set-no{background:var(--good-soft);color:var(--good)}
.set-no.warm,.set-row.done .set-no.warm{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.numwrap{display:flex;align-items:center;background:var(--surface-2);border:1.5px solid transparent;border-radius:11px;height:48px;overflow:hidden}
.numwrap:focus-within{border-color:var(--accent);background:var(--surface)}
.numwrap button{width:38px;height:100%;font-size:20px;color:var(--ink-3);font-weight:500}
.numwrap button:active{color:var(--accent)}
.numwrap input{flex:1;min-width:0;text-align:center;border:none;background:none;height:100%;font-family:"IBM Plex Mono";font-size:18px;font-weight:600;color:var(--ink)}
.numwrap input:focus{outline:none}
.set-check{width:44px;height:44px;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-3)}
.set-check.on{background:var(--good);border-color:transparent;color:#fff}
.set-actions{display:flex;gap:8px;padding:4px 3px 12px;flex-wrap:wrap}
.linkbtn{font-size:13px;font-weight:600;color:var(--accent);padding:7px 4px;display:inline-flex;align-items:center;gap:5px}
.linkbtn.dim{color:var(--ink-3)}
.hint{font-size:11.5px;color:var(--ink-3);padding:0 4px 8px}

/* suggestion banner */
.sugg{display:flex;align-items:center;gap:10px;margin:0 12px 11px;padding:9px 12px;border-radius:11px;background:var(--accent-soft);font-size:13px;color:var(--accent);font-weight:500}
.sugg.match{background:var(--surface-2);color:var(--ink-2)}
.sugg .lastp{font-family:"IBM Plex Mono";font-weight:600}
.sugg .apply{margin-left:auto;background:var(--accent);color:var(--accent-ink);height:30px;padding:0 12px;border-radius:9px;font-weight:600;font-size:12.5px;flex-shrink:0}

/* Stats */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{padding:15px 16px}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:"Archivo";font-weight:800;font-size:27px;letter-spacing:-.02em;margin-top:5px;line-height:1}
.stat .v small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:3px}

/* bar chart */
.chart{display:flex;align-items:flex-end;gap:7px;height:132px;padding:6px 2px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .3s}
.bar.z{background:var(--line)}
.bar-lb{font-size:10px;color:var(--ink-3);font-weight:600}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h3{font-size:17px}
.cal-head .icon-btn{font-size:26px;color:var(--ink);background:var(--surface-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-3);padding-bottom:4px}
.cal-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--ink-2);position:relative;background:transparent}
.cal-cell.pad{color:transparent}
.cal-cell.today{outline:1.5px solid var(--accent);color:var(--ink)}
.cal-cell.has{background:var(--accent);color:var(--accent-ink)}
.cal-cell.has.sel,.cal-cell.sel{outline:2px solid var(--ink)}

/* session cards / detail */
.sess{padding:14px 16px;margin-bottom:11px}
.sess-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sess-date{font-family:"Archivo";font-weight:700;font-size:15px}
.sess-meta{display:flex;gap:14px;margin-top:9px;font-size:12.5px;flex-wrap:wrap}
.sess-meta b{font-family:"IBM Plex Mono";font-weight:600;color:var(--ink)}
.sess-ex{margin-top:11px;display:flex;flex-direction:column;gap:3px}
.sess-ex div{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:12px}
.sess-ex .s{font-family:"IBM Plex Mono";color:var(--ink-3);flex-shrink:0}

/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:51;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(101%);transition:transform .28s cubic-bezier(.32,.72,0,1);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:translateY(0)}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:18px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:16px 18px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet-x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}

/* misc */
.list{overflow:hidden}
.spacer{height:8px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.instr{font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:.25s;box-shadow:var(--shadow);pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:16px;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.act{pointer-events:auto}
.toast button{color:var(--accent);font-weight:700;font-size:14px;padding:0;letter-spacing:.02em}
.cdialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;width:min(340px,86vw);box-shadow:0 24px 70px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.cdialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.cdialog h3{font-size:18px}
.cdialog p{margin:8px 0 20px;font-size:14px;line-height:1.5}
.cd-btns{display:flex;gap:10px}
.cd-btns .btn{flex:1;height:46px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;min-height:32px}
.backbtn{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:15px;color:var(--ink-2);padding:6px 8px 6px 0}
.backbtn svg{width:20px;height:20px}
.resume{width:100%;text-align:left;padding:15px;margin-top:16px;display:flex;align-items:center;gap:13px;border:1.5px solid var(--accent);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.resume:active{transform:scale(.99)}
.tri{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.routine{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface);margin-bottom:9px}
.routine .ex-ic{width:38px;height:38px}
.routine .del{margin-left:auto;color:var(--ink-3);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
/* rest timer */
.restbar{position:fixed;left:0;right:0;bottom:calc(74px + var(--safe-b));z-index:40;display:none}
.restbar.on{display:block}
.restbar .inner{max-width:520px;margin:0 auto;padding:0 12px}
.restbar .rcard{background:var(--ink);color:var(--bg);border-radius:14px;padding:9px 12px;display:flex;align-items:center;gap:11px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.restbar.done .rcard{background:var(--good);color:#fff}
.rest-time{font-family:"IBM Plex Mono";font-weight:600;font-size:19px;min-width:52px}
.rest-lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:1px}
.rest-prog{flex:1;height:6px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.rest-prog span{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s linear}
.restbar.done .rest-prog span{background:#fff}
.rest-btn{background:rgba(255,255,255,.16);color:inherit;height:34px;padding:0 12px;border-radius:9px;font-weight:600;font-size:13px;flex-shrink:0}
.rest-btn:active{background:rgba(255,255,255,.28)}
/* toggle switch + steppers */
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex-shrink:0;transition:background .15s}
.sw.on{background:var(--good)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on::after{left:23px}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px}
.stepper button{width:34px;height:32px;border-radius:8px;font-size:18px;color:var(--ink-2);font-weight:500}
.stepper button:active{color:var(--accent)}
.stepper .val{min-width:52px;text-align:center;font-weight:600}
.cloud{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.cloud .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.cloud.synced .dot{background:var(--good)}
.cloud.local .dot{background:var(--warn)}
.cloud.err .dot{background:#d33a26}
.settingrow{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;border-bottom:1px solid var(--line);gap:12px}
.settingrow:last-child{border:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{padding:7px 15px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* standalone: let the blurred header run under the status bar */
.app-head{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>
<body>
<header class="app-head">
  <div class="wrap">
    <div class="brand"><span class="spark"></span>Ironlog</div>
    <div style="display:flex;align-items:center;gap:4px">

(function(){'use strict';
// Pure merge/backup logic shared by every cloud backend (Claude DB, Dropbox, file import).
var IL=globalThis.IL||(globalThis.IL={});

const TOMB_KEEP=90*86400000;   // remember deletions for 90 days so no device resurrects them

// Merge by id, newest updatedAt wins. tomb = {id: deletedAt}. Returns what changed on each side.
function mergeSessions(local,remote,tomb){
  tomb=tomb||{};
  const map=new Map((local||[]).map(s=>[s.id,s]));
  let changedLocal=false,pushNeeded=false;
  (remote||[]).forEach(r=>{
    if(!r||!r.id)return;
    if(tomb[r.id]&&tomb[r.id]>=(r.updatedAt||0)){pushNeeded=true;return;}   // deleted here after remote's copy → stays deleted
    const l=map.get(r.id);
    if(!l){map.set(r.id,r);changedLocal=true;}
    else if((r.updatedAt||0)>(l.updatedAt||0)){map.set(r.id,r);changedLocal=true;}
    else if((l.updatedAt||0)>(r.updatedAt||0))pushNeeded=true;
  });
  const remoteIds=new Set((remote||[]).map(r=>r&&r.id));
  (local||[]).forEach(l=>{if(!remoteIds.has(l.id))pushNeeded=true;});
  const merged=[...map.values()].sort((a,b)=>(b.date||0)-(a.date||0));
  return {merged,changedLocal,pushNeeded};
}
// Apply another device's deletions; returns {sessions, tomb, changed}
function applyTombstones(sessions,localTomb,remoteTomb){
  const tomb=Object.assign({},localTomb||{});let changed=false;
  Object.entries(remoteTomb||{}).forEach(([id,at])=>{if(!tomb[id]||at>tomb[id])tomb[id]=at;});
  const out=(sessions||[]).filter(s=>{const t=tomb[s.id];if(t&&t>=(s.updatedAt||0)){changed=true;return false;}return true;});
  return {sessions:out,tomb,changed};
}
function pruneTombstones(tomb,now){
  now=now||Date.now();const out={};
  Object.entries(tomb||{}).forEach(([id,at])=>{if(now-at<TOMB_KEEP)out[id]=at;});
  return out;
}
// The one backup/sync document shape (file export and Dropbox both use it)
function exportPayload(st,version){
  return {app:'ironlog',format:2,version:version||'',exported:new Date().toISOString(),
    settings:st.settings,sessions:st.sessions,routines:st.routines||[],deleted:st.deleted||{},active:st.active||null};

function parseImport(json){

}

IL.sync={mergeSessions,applyTombstones,pruneTombstones,exportPayload,parseImport,TOMB_KEEP};
if(typeof module!=='undefined')module.exports=IL.sync;

})();

(function(){'use strict';

const appKey=()=>(IL.config&&IL.config.DROPBOX_APP_KEY)||'';

function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}

  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});

async function getMetadata(){

async function download(){
  const at=await accessToken();

  if(r.status===409)return null;
  if(!r.ok)throw new Error('Dropbox download failed');

async function upload(text){
  const at=await accessToken();

/* ---------------- viewport height (real fix for the sticky tab bar gap) ---------------- */
// 100dvh is unreliable inside an embedded WKWebView (confirmed: WebKit bugs 170595 and 261185) —
// it can bake in a stale height from mid-toolbar-animation and never recompute, which is exactly
// why the gap only showed up on taller/scrolled tabs (Progress, Library) and not short ones (Today,
// History): same <body>, same CSS rule, but a stale dvh snapshot from whenever that tab last
// reflowed. window.visualViewport is built on lower-level, more reliable machinery and fires a real
// event whenever the true visible area changes, so we measure it directly instead of trusting the
// CSS unit. rAF-debounced per the documented recommended pattern.
let vvhPending=false;
function syncViewportHeight(){
  if(vvhPending)return;vvhPending=true;
  requestAnimationFrame(()=>{
    vvhPending=false;
    const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;
    if(h)document.documentElement.style.setProperty('--vvh',h+'px');
  });
}

if(window.visualViewport){window.visualViewport.addEventListener('resize',syncViewportHeight);window.visualViewport.addEventListener('scroll',syncViewportHeight);}
window.addEventListener('resize',syncViewportHeight);

// a WKWebView's own native layout can still be settling after our first paint (its parent view's
// constraints haven't resolved yet), which can hand JS a wrong initial measurement that no later
// resize event corrects — a couple of cheap delayed re-checks catch that without depending on any
// event actually firing.

  for(let d=1;d<=days;d++){const ts=new Date(y,m,d).getTime();

  return `<div class="cal-head"><button class="icon-btn" data-mon="-1" aria-label="Previous month">‹</button><h3>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><button class="icon-btn" data-mon="1" aria-label="Next month">›</button></div>

function volumeChart(){

function prList(){

function balBar(l,lv,r,rv){
  const total=lv+rv||1,lp=Math.round(lv/total*100);
  return `<div style="margin-bottom:13px"><div class="row-between" style="font-size:12.5px;margin-bottom:5px"><span style="font-weight:600">${l} <span class="mono dim">${lv}</span></span><span style="font-weight:600"><span class="mono dim">${rv}</span> ${r}</span></div>
    <div style="height:9px;border-radius:5px;overflow:hidden;display:flex;background:var(--surface-2)"><div style="width:${lp}%;background:var(--accent)"></div><div style="flex:1;background:var(--good)"></div></div></div>`;
}
// How much longer until Coach's Notes will show program-level verdicts (push/pull balance, legs
// undertrained, weekly-volume landmarks) — those need real history to mean anything, so a brand-new
// user sees encouragement here instead of a premature judgment. See analysis.js MIN_COMPARATIVE_*.
function buildupMessage(a){
  const remS=Math.max(0,A.MIN_COMPARATIVE_SESSIONS-a.sessions);
  if(remS>0)return `Log ${remS} more session${remS===1?'':'s'} and I'll start giving you balance and volume feedback.`;
  if(a.daySpan<A.MIN_COMPARATIVE_DAYS)return `A few more days of training and I'll start giving you balance and volume feedback.`;
  return `I'll start giving you balance and volume feedback soon.`;
}
function tipsCard(tips){
  const dot={warn:'var(--warn)',good:'var(--good)',info:'var(--ink-3)'};
  return `<div class="card" style="padding:4px 16px">${tips.map((t,i)=>`<div style="display:flex;gap:11px;padding:12px 0;${i?'border-top:1px solid var(--line)':''}"><span style="width:9px;height:9px;border-radius:50%;background:${dot[t.lv]};flex-shrink:0;margin-top:5px"></span><div style="font-size:13.5px;line-height:1.5">${t.x}</div></div>`).join('')}</div>`;
}
function coachCard(done){
  if(!done.length)return '';
  const a=A.analyze(state.sessions,Date.now());
  const tips=A.buildTips(a,state.sessions,Date.now(),bw());
  if(!a.readyForComparative){
    // early on: encouragement + whatever per-muscle tips (region/pattern gaps, progression) are
    // already individually meaningful — no full balance analysis yet, so no "Effectiveness" bars
    return `<div class="eyebrow" style="margin:24px 2px 10px">Coach's notes</div>
      <div class="card" style="padding:16px;margin-bottom:${tips.length?'12':'0'}px"><div class="dim" style="font-size:13.5px;line-height:1.5">${buildupMessage(a)}</div></div>
      ${tips.length?tipsCard(tips):''}`;
  }
  return `<div class="eyebrow" style="margin:24px 2px 10px">Effectiveness · last 4 weeks</div>
    <div class="card" style="padding:16px 16px 6px">${balBar('Push',a.push,'Pull',a.pull)}${balBar('Upper body',a.upperSets,'Lower body',a.lowerSets)}</div>
    <div class="eyebrow" style="margin:18px 2px 10px">Coach's notes</div>
    ${tips.length?tipsCard(tips):`<div class="card" style="padding:20px;text-align:center"><div class="dim">Nothing to flag — your training looks well-rounded right now.</div></div>`}`;
}
function muscleBreakdown(mo){

function convertUnits(from,to){
  const ids=P.convertSessions(state.sessions,from,to);
  ids.forEach(id=>state.dirty.add(id));S.saveSessions();S.saveDirty();
  if(state.active){state.active.exercises.forEach(e=>e.sets.forEach(st=>{st.w=P.convertWeight(st.w,from,to);}));S.persistActive();}
  if(editSession)editSession.exercises.forEach(e=>e.sets.forEach(st=>{st.w=P.convertWeight(st.w,from,to);}));
  state.settings.bodyweight=Math.round(P.convertWeight(bw(),from,to)||0);
  state.settings.unit=to;S.saveSettingsCloud();
  if(state.cloud)state.cloud.flush();
}
async function exportData(){

  try{if(window.claude&&claude.use){const dl=await claude.use('downloads');if(dl){await dl.save({filename:fname,data:json});toast('Backup saved');return;}}}catch(e){}
  try{const blob=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup downloaded');}
  catch(e){toast('Could not export here');}
}

}
function openSessionDetail(sid){
  const s=state.sessions.find(x=>x.id===sid);if(!s)return;
  openSheet(fmtDate(s.date),`<div class="sess-meta" style="margin:0 0 16px"><span class="muted">Volume <b>${fmtVol(volOf(s))} ${U()}</b></span><span class="muted">Sets <b>${setsOf(s)}</b></span><span class="muted">${new Date(s.date).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span></div>
    ${s.exercises.map(e=>{const ex=EX[e.id];return `<div class="card" style="padding:13px 15px;margin-bottom:10px">
      <div style="display:flex;gap:11px;align-items:center;margin-bottom:9px"><div class="ex-ic" style="width:36px;height:36px">${exIcon(ex?ex.group:'Core')}</div><div class="ex-name">${esc(ex?ex.name:e.name)}</div></div>
      <div class="setgrid" style="padding:0"><div class="set-hdr"><div>Set</div><div>${U()}</div><div>Reps</div><div></div></div>
      ${e.sets.filter(st=>st.done!==false).map((st,i)=>`<div class="set-row"><div class="set-no ${st.warm?'warm':''}">${st.warm?'W':i+1}</div><div class="numwrap" style="justify-content:center"><span class="mono" style="font-size:16px;font-weight:600">${st.w||0}</span></div><div class="numwrap" style="justify-content:center"><span class="mono" style="font-size:16px;font-weight:600">${st.r||0}</span></div><div></div></div>`).join('')}</div></div>`;}).join('')}
    <div style="display:flex;gap:9px;margin:8px 0 10px"><button class="btn ghost" style="flex:1" data-editsess="${s.id}">✎ Edit</button><button class="btn ghost" style="flex:1" data-repeatfrom="${s.id}">↻ Repeat</button></div>
    <button class="btn ghost block" data-routinefrom="${s.id}" style="margin-bottom:10px">★ Save as routine</button>
    <button class="linkbtn dim" data-delsess="${s.id}" style="display:block;text-align:center;width:100%">Delete this session</button>`);
  const body=$('#sheetBody');
  body.querySelector('[data-repeatfrom]').addEventListener('click',()=>{closeSheet();startSession(s.exercises.map(e=>e.id),'Loaded — weights prefilled');setTab('today');});
  body.querySelector('[data-editsess]').addEventListener('click',()=>{closeSheet();startEdit(s);});
  body.querySelector('[data-routinefrom]').addEventListener('click',()=>{closeSheet();saveAsRoutine(s);});
  body.querySelector('[data-delsess]').addEventListener('click',()=>showConfirm('Delete session?','This removes the workout from your history.','Delete',()=>{
    const copy=JSON.parse(JSON.stringify(s));S.deleteSession(s.id);closeSheet();render();
    toast('Session deleted',{label:'Undo',fn:()=>{S.restoreSession(copy);render();toast('Restored');}});}));
}

/* ---------------- actions ---------------- */
function addExerciseToCur(id){
  if(todayScreen!=='edit'&&!state.active){S.setActive(newSession([]));}
  const t=cur();
  if(t.exercises.some(x=>x.id===id)){toast('Already added');return;}
  t.exercises.push(B.seedExercise(id,state.sessions,t.id));
  persistCur();if(todayScreen!=='edit')todayScreen='active';
  if(currentTab!=='today')setTab('today');else render();
  toast(EX[id].name+' added');
}
function reorderCur(){
  const t=cur();if(!t||t.exercises.length<2)return;
  const counts={};t.exercises.forEach(e=>{const g=EX[e.id]&&EX[e.id].group;if(g)counts[g]=(counts[g]||0)+1;});
  const focus=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const map={};t.exercises.forEach(e=>map[e.id]=e);
  t.exercises=B.orderByFatigue(t.exercises.map(e=>e.id),focus).map(id=>map[id]);
  persistCur();render();toast('Ordered for best performance');
}
// A set counts as performed if it was ticked done or has a weight entered. Prefilled reps alone
// never count — otherwise untouched prescribed sets would pollute history.
function cleanSets(s){
  s.exercises.forEach(e=>{e.sets=e.sets.filter(st=>st.done||+st.w).map(st=>Object.assign(st,{done:true}));});
  s.exercises=s.exercises.filter(e=>e.sets.length);
}
function finishWorkout(){
  const s=state.active;cleanSets(s);
  if(!s.exercises.length){toast('Log at least one set first');return;}
  s.completed=true;s.updatedAt=Date.now();
  S.upsertSession(s,false);state.active=null;S.persistActive();todayScreen='home';
  toast('Workout saved 💪');setTab('history');
}
function startEdit(s){editSession=JSON.parse(JSON.stringify(s));editDirty=false;todayScreen='edit';setTab('today');}
function finishEdit(){
  const s=editSession;cleanSets(s);
  if(!s.exercises.length){toast('Keep at least one set, or delete the session instead');return;}
  s.updatedAt=Date.now();S.upsertSession(s,false);
  editSession=null;editDirty=false;todayScreen='home';toast('Changes saved');setTab('history');
}
function leaveEditor(){
  if(todayScreen==='edit'){
    const go=()=>{editSession=null;editDirty=false;todayScreen='home';setTab('history');};
    if(editDirty)showConfirm('Discard changes?','Your edits to this session will be lost.','Discard',go);else go();
  }else{todayScreen='home';render();}
}

/* ---------------- bind ---------------- */
function bindClick(sel,fn){const el=$(sel);if(el)el.addEventListener('click',fn);}
function bind(){
  const v=$('#view');
  bindClick('#btnStartFlow',()=>{todayScreen='start';render();});
  bindClick('#btnResume',()=>{todayScreen='active';render();});
  bindClick('#btnGoLibrary',()=>setTab('library'));
  bindClick('#btnBackHome',leaveEditor);
  const gp=$('#groupPick');if(gp)gp.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;const g=b.dataset.g;pickedGroups.has(g)?pickedGroups.delete(g):pickedGroups.add(g);b.classList.toggle('on');});
  bindClick('#btnRecommend',()=>{const ids=B.buildRecommendation([...pickedGroups],state.sessions);pickedGroups.clear();startSession(ids,'Workout built — adjust anything');});
  bindClick('#btnBlank',()=>startSession([]));
  v.querySelectorAll('[data-repeat]').forEach(b=>b.addEventListener('click',()=>{const s=state.sessions.find(x=>x.id===b.dataset.repeat);if(s)startSession(s.exercises.map(e=>e.id),'Loaded — weights prefilled from history');}));
  v.querySelectorAll('[data-routine]').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('[data-delroutine]'))return;
    const r=state.routines.find(x=>x.id===el.dataset.routine);if(r)startSession(r.exIds,r.name+' loaded');}));
  v.querySelectorAll('[data-delroutine]').forEach(b=>b.addEventListener('click',()=>{
    const r=state.routines.find(x=>x.id===b.dataset.delroutine);if(!r)return;
    showConfirm('Delete routine?',r.name+' will be removed.','Delete',()=>{const copy=Object.assign({},r);S.deleteRoutine(r.id);render();toast('Routine deleted',{label:'Undo',fn:()=>{S.saveRoutine(copy);render();}});});}));
  // editor
  bindClick('#btnAddEx',openAddExercise);
  const sg=v.querySelector('[data-suggest]');if(sg)sg.addEventListener('click',()=>addExerciseToCur(sg.dataset.suggest));
  bindClick('#btnReorder',reorderCur);
  bindClick('#btnSaveRoutine',()=>saveAsRoutine(cur()));
  bindClick('#btnFinish',finishWorkout);
  bindClick('#btnSaveEdit',finishEdit);
  bindClick('#btnDiscard',()=>showConfirm('Discard workout?','Nothing from this session will be saved.','Discard',()=>{
    const copy=state.active;state.active=null;S.persistActive();todayScreen='home';render();
    toast('Workout discarded',{label:'Undo',fn:()=>{S.setActive(copy);todayScreen='active';render();}});}));
  const ll=$('#logList');if(ll)bindLog(ll);
  // history
  const sl=$('#sessList'),cal=v.querySelector('.cal-grid');
  if(cal)cal.addEventListener('click',e=>{const c=e.target.closest('[data-day]');if(!c)return;const d=+c.dataset.day;selDay=selDay===d?null:d;render();});
  v.querySelectorAll('[data-mon]').forEach(b=>b.addEventListener('click',()=>{calMonth+=+b.dataset.mon;selDay=null;render();}));
  if(sl)sl.addEventListener('click',e=>{const c=e.target.closest('[data-sess]');if(c)openSessionDetail(c.dataset.sess);});
  // library
  const ls=$('#libSearch');if(ls)ls.addEventListener('input',()=>{libQuery=ls.value;const pos=ls.selectionStart;render();const n=$('#libSearch');if(n){n.focus();n.setSelectionRange(pos,pos);}});
  v.querySelectorAll('[data-lg]').forEach(b=>b.addEventListener('click',()=>{libGroup=b.dataset.lg;render();}));
  // library rows: the "+" adds straight to today's workout; the rest of the row opens details
  v.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',e=>{
    if(e.target.closest('.ex-add')){addExerciseToCur(b.dataset.open);return;}
    openSheet(EX[b.dataset.open].name,exerciseDetail(b.dataset.open));}));
}
function bindLog(root){
  root.addEventListener('click',e=>{
    const t=cur();if(!t)return;
    const chk=e.target.closest('[data-check]');if(chk){const ei=+chk.dataset.check,si=+chk.dataset.s;const st=t.exercises[ei].sets[si];st.done=!st.done;
      if(st.done&&todayScreen==='active'&&state.settings.rest.auto&&!st.warm)startRest(restSecondsFor(t.exercises[ei].id));persistCur();render();return;}
    const wm=e.target.closest('[data-warm]');if(wm){const ei=+wm.dataset.warm,si=+wm.dataset.s;const st=t.exercises[ei].sets[si];st.warm=!st.warm;persistCur();render();toast(st.warm?'Marked as warm-up':'Counted as a working set');return;}
    const step=e.target.closest('[data-step]');if(step){const ei=+step.dataset.ei,si=+step.dataset.s,f=step.dataset.step,d=+step.dataset.d;const st=t.exercises[ei].sets[si];let v=+st[f]||0;v+=f==='w'?d*inc():d;if(v<0)v=0;st[f]=v;persistCur();const inp=$(`input[data-f="${f}"][data-ei="${ei}"][data-s="${si}"]`);if(inp)inp.value=v;return;}
    const add=e.target.closest('[data-addset]');if(add){const ei=+add.dataset.addset;const sets=t.exercises[ei].sets;const last=sets[sets.length-1]||{w:'',r:''};sets.push({w:last.w,r:last.r,done:false});persistCur();render();return;}
    const del=e.target.closest('[data-delex]');if(del){const ei=+del.dataset.delex;const removed=t.exercises.splice(ei,1)[0];persistCur();render();
      toast(removed.name+' removed',{label:'Undo',fn:()=>{const c=cur();if(c){c.exercises.splice(ei,0,removed);persistCur();render();}}});return;}
    const bwp=e.target.closest('[data-bumpw]');if(bwp){const ei=+bwp.dataset.bumpw;t.exercises[ei].sets.forEach(s=>{s.w=(+s.w||0)+inc();});persistCur();render();toast('Weights bumped +'+inc()+U());return;}
    const oe=e.target.closest('[data-openex]');if(oe){openSheet(EX[oe.dataset.openex].name,exerciseDetail(oe.dataset.openex));return;}
  });
  root.addEventListener('input',e=>{const inp=e.target.closest('input[data-f]');if(!inp)return;const t=cur();if(!t)return;
    const ei=+inp.dataset.ei,si=+inp.dataset.s,f=inp.dataset.f;const val=inp.value.replace(/[^0-9.]/g,'');
    t.exercises[ei].sets[si][f]=val===''?'':(f==='r'?parseInt(val)||val:parseFloat(val)||val);persistCur();});
}

/* ---------------- rest timer ---------------- */
let restState=null,restInt=null,audioCtx=null;
function unlockAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function beep(){
  if(!state.settings.rest.sound)return;
  try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
    [0,0.22,0.44].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=i===2?1046:784;o.type='sine';o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.35,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.18);o.start(t+d);o.stop(t+d+0.2);});
  }catch(e){}
}
function restSecondsFor(exId){const ex=EX[exId];const r=state.settings.rest;return ex?(ex.type===C?r.compound:r.isolation):90;}
function startRest(seconds){
  if(!seconds||seconds<5)return;
  restState={total:seconds,end:Date.now()+seconds*1000};
  const bar=$('#restbar');bar.classList.add('on');bar.classList.remove('done');$('#restLbl').textContent='Rest';
  clearInterval(restInt);restInt=setInterval(tickRest,300);tickRest();
}
function tickRest(){
  if(!restState)return;
  const rem=Math.max(0,restState.end-Date.now()),s=Math.ceil(rem/1000);
  $('#restTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('#restProg').style.width=(100-(rem/(restState.total*1000))*100)+'%';
  if(rem<=0)finishRest();
}
function finishRest(){
  clearInterval(restInt);restInt=null;
  const bar=$('#restbar');bar.classList.add('done');$('#restLbl').textContent='Rest done';$('#restTime').textContent='Go!';$('#restProg').style.width='100%';
  beep();try{if(navigator.vibrate)navigator.vibrate([180,90,180]);}catch(e){}
  if(state.settings.rest.notify&&'Notification'in window&&Notification.permission==='granted'){try{new Notification('Rest complete 💪',{body:'Time for your next set.'});}catch(e){}}
  restState=null;setTimeout(()=>{const b=$('#restbar');if(b.classList.contains('done'))stopRest();},5000);
}
function stopRest(){clearInterval(restInt);restInt=null;restState=null;const b=$('#restbar');b.classList.remove('on','done');}

/* ---------------- boot ---------------- */
function boot(){
  state.sessions.forEach(s=>{if(!s.schema)s.schema=SCHEMA;});   // schema migrations live here
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  $('#sheetClose').addEventListener('click',closeSheet);$('#scrim').addEventListener('click',closeSheet);
  $('#cdCancel').addEventListener('click',closeConfirm);$('#cscrim').addEventListener('click',closeConfirm);
  $('#cdOk').addEventListener('click',()=>{const cb=_confirmCb;closeConfirm();if(cb)cb();});
  $('#sheetBody').addEventListener('click',e=>{const a=e.target.closest('[data-addto]');if(a){addExerciseToCur(a.dataset.addto);closeSheet();}});
  $('#btnSettings').addEventListener('click',openSettings);
  $('#restSkip').addEventListener('click',stopRest);
  $('#restAdd').addEventListener('click',()=>{if(!restState)return;restState.end+=15000;restState.total+=15;$('#restbar').classList.remove('done');if(!restInt)restInt=setInterval(tickRest,300);tickRest();});
  document.addEventListener('pointerdown',unlockAudio);
  $('#view').addEventListener('click',e=>{if(e.target.closest('[data-vol-info]'))toast('Volume = weight × reps, added up across your working sets');});
  // re-render on cloud changes, but never yank focus from someone typing a weight
  S.onChange(()=>{updateCloud();const a=document.activeElement;if(a&&a.tagName==='INPUT')return;render();});
  applyTheme();setTab('today');S.initCloud();
  if(state.justSeeded)setTimeout(()=>toast('Sample data loaded — explore every tab'),600);
}
IL.ui={toast,render,setTab,openSettings,boot};
boot();

})();

</script>
