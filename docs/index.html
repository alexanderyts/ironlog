<meta name="description" content="Ironlog — a smart, fast workout tracker.">

<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --line:#dde3ea;
  --ink:#141b24; --ink-2:#4a5967; --ink-3:#8695a4;
  --accent:#f5511e; --accent-ink:#ffffff; --accent-soft:#fde7de;
  --good:#12915c; --good-soft:#dcf1e7; --warn:#b8860b;
  --shadow:0 1px 2px rgba(20,27,36,.06),0 6px 20px rgba(20,27,36,.06);
  --radius:16px; --radius-sm:11px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --tab-h:64px;
  /* Set by IL.ui (syncViewportDeficit) in standalone iOS only: how far the layout viewport falls
     short of the screen at launch (screen.height − innerHeight; measured 62px on an iPhone Pro Max,
     = the top inset wrongly subtracted from the bottom). 0 everywhere else and after WebKit's flip. */
  --deficit:0px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1219; --surface:#161d27; --surface-2:#1d2632; --line:#2a3441;
    --ink:#e9eef4; --ink-2:#a7b4c2; --ink-3:#6f7e8e;
    --accent:#ff6337; --accent-ink:#160a05; --accent-soft:#3a1d12;
    --good:#34c184; --good-soft:#123227; --warn:#e0a93a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1219; --surface:#161d27; --surface-2:#1d2632; --line:#2a3441;
  --ink:#e9eef4; --ink-2:#a7b4c2; --ink-3:#6f7e8e;
  --accent:#ff6337; --accent-ink:#160a05; --accent-soft:#3a1d12;
  --good:#34c184; --good-soft:#123227; --warn:#e0a93a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
/* Kill iOS Safari's double-tap-to-zoom (the cause of the screen "zooming in" when tapping the +/-
   steppers quickly) while still allowing normal panning and pinch-zoom-out for accessibility. */
html{touch-action:manipulation}
/* Contain rubber-band overscroll so the page doesn't bounce/reveal odd background at the top/bottom
   edges — set on both html and body since which one is "the" scrolling element is inconsistent
   across engines. */
html,body{overscroll-behavior-y:contain}
[hidden]{display:none!important}
/* ── iOS safe-area model (read before touching the header/tab bar) ──────────────────────────────
   On iOS (standalone PWA and the Claude app's WKWebView alike), a freshly launched page is first
   laid out with the safe areas applied as an INSET: the viewport is shrunk to the "safe" rectangle
   and env(safe-area-inset-*) reads 0. At some later native layout pass (typically the first scroll)
   it flips to full-bleed: the viewport grows to the whole screen and env() becomes real (34px at the
   bottom of a Face ID iPhone, 44–59px at the top). WebKit bug 191872 — open since 2018, no CSS or JS
   hook fires for the flip, and measuring in JS just reads the same wrong numbers.

   What that means: the ~34px strip under the home indicator is OUTSIDE the viewport in the inset
   state. Nothing can paint there — WebKit fills it with the canvas colour (html/body background).
   So a bottom bar painted in a colour other than the canvas shows a visible seam above that strip
   on launch. That seam is the "gap" seen on every previous attempt (sticky, fixed, flow, dvh);
   the bar was always in the right place, it was just a different colour from the strip below it.

   The fix is to make the layout INVARIANT across both states, so the flip is a no-op on screen:
     • html and body both carry --bg, so the un-paintable strip is a known colour;
     • the tab bar and header are painted in that same --bg tint, not --surface;
     • the bar is fixed to the viewport bottom with padding-bottom:env(inset-bottom). Inset state:
       bar bottom sits 34px above the screen edge with 0 padding. Full-bleed: bar bottom sits at
       the screen edge with 34px padding. The icons land on the same screen pixel either way, and
       the padding region is the same colour as the strip it replaces. Same logic for the header
       via padding-top. Content clearance (body padding-bottom) tracks the bar with the same env().
   No timers, no measurement, nothing to get wrong. Do not reintroduce dvh/JS-measured heights. */
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--ink);
  padding-bottom:calc(var(--tab-h) + var(--safe-b));
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5; font-size:14px;
}
#view{width:100%}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select{font-family:inherit}
h1,h2,h3{margin:0; text-wrap:balance; font-family:"Archivo",system-ui,sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:520px; margin:0 auto; padding:0 16px}

/* Header */
.app-head{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 86%,transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.app-head .wrap{display:flex; align-items:center; justify-content:space-between; height:56px}
.brand{font-family:"Archivo"; font-weight:800; font-size:20px; letter-spacing:-.02em; display:flex; align-items:center; gap:8px}
.brand .spark{width:10px;height:22px;background:var(--accent);border-radius:2px;transform:skewX(-12deg)}
.icon-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--surface-2)}
.view-title{font-family:"Archivo";font-weight:800;font-size:15px;letter-spacing:-.01em}

/* Tab bar — see the safe-area model comment above body. Fixed to the viewport bottom, painted in
   the canvas colour (--bg, opaque) so the padding region and the un-paintable strip below it in the
   inset state are indistinguishable. Must stay opaque --bg: a translucent or --surface bar brings
   the launch seam straight back. */
/* translateZ(0) is load-bearing: it makes the bar its own compositing layer, and only composited
   layers get painted in the region below the short launch viewport (v0.8.7 screenshot: icons drawn,
   labels — which fall below the 894px line — missing). */
.tabbar{position:fixed;left:0;right:0;bottom:calc(-1 * var(--deficit));z-index:30;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b);transform:translateZ(0)}
/* Installed iOS app (html.standalone, set by IL.ui): anchor the bar by its TOP to screen.height —
   a constant — instead of to the viewport bottom. Its screen position is then identical before and
   after WebKit's launch-time viewport correction, with no JS in the loop, so nothing can flicker
   on the frame the correction lands. (--deficit still drives the sheet/scrim/rest bar/toast.) */
html.standalone .tabbar{bottom:auto;top:calc(var(--screen-h,100vh) - var(--tab-h) - var(--safe-b) - 1px)}
.tabbar .row{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.01em}
.tab svg{width:23px;height:23px}
.tab.active{color:var(--accent)}

/* Generic */
.section{padding:18px 0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:13px;font-weight:600;font-size:15px;background:var(--surface);border:1px solid var(--line);color:var(--ink);transition:transform .05s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.good{background:var(--good);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{background:#d33a26;color:#fff;border-color:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{height:40px;font-size:14px;padding:0 14px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips.hscroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.hscroll::-webkit-scrollbar{display:none}
.chips.hscroll .chip{flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* Inputs */
.field{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 15px;font-size:16px}
.field:focus{outline:none;border-color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:0 14px;height:50px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:none;background:none;height:100%;font-size:16px;color:var(--ink)}
.search input:focus{outline:none}
.search svg{width:19px;height:19px;color:var(--ink-3)}

/* Exercise rows */
.ex-row{display:flex;align-items:center;gap:13px;padding:13px 15px;border-bottom:1px solid var(--line)}
.ex-row:last-child{border-bottom:none}
.ex-ic{width:42px;height:42px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;color:var(--accent)}
.ex-ic svg{width:22px;height:22px}
.ex-name{font-weight:600;font-size:15px;line-height:1.25}
.ex-sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.ex-add{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}

/* Set logging */
.log-ex{margin-bottom:14px;overflow:hidden}
.log-ex-head{display:flex;align-items:center;gap:11px;padding:13px 15px 11px}
.log-ex-head .ex-ic{width:38px;height:38px}
.setgrid{padding:0 12px 6px}
.set-hdr,.set-row{display:grid;grid-template-columns:30px 1fr 1fr 40px;gap:8px;align-items:center}
.set-hdr{padding:2px 4px 8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.set-hdr div:nth-child(2),.set-hdr div:nth-child(3){text-align:center}
.set-row{margin-bottom:9px}
.set-no{width:30px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--ink-2);font-family:"IBM Plex Mono";font-size:14px}
.set-row.done .set-no{background:var(--good-soft);color:var(--good)}
.set-no.warm,.set-row.done .set-no.warm{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.numwrap{display:flex;align-items:center;background:var(--surface-2);border:1.5px solid transparent;border-radius:11px;height:48px;overflow:hidden}
.numwrap:focus-within{border-color:var(--accent);background:var(--surface)}
.numwrap button{width:28px;height:100%;font-size:20px;color:var(--ink-3);font-weight:500}
.numwrap button:active{color:var(--accent)}
.numwrap input{flex:1;min-width:0;text-align:center;border:none;background:none;height:100%;font-family:"IBM Plex Mono";font-size:16px;font-weight:600;color:var(--ink)}
.numwrap input:focus{outline:none}
.set-check{width:40px;height:44px;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink-3)}
.set-check.on{background:var(--good);border-color:transparent;color:#fff}
.set-actions{display:flex;gap:8px;padding:4px 3px 12px;flex-wrap:wrap}
.linkbtn{font-size:13px;font-weight:600;color:var(--accent);padding:7px 4px;display:inline-flex;align-items:center;gap:5px}
.linkbtn.dim{color:var(--ink-3)}
.hint{font-size:11.5px;color:var(--ink-3);padding:0 4px 8px}

/* suggestion banner */
.sugg{display:flex;align-items:center;gap:10px;margin:0 12px 11px;padding:9px 12px;border-radius:11px;background:var(--accent-soft);font-size:13px;color:var(--accent);font-weight:500}
.sugg.match{background:var(--surface-2);color:var(--ink-2)}
.sugg .lastp{font-family:"IBM Plex Mono";font-weight:600}
.sugg .apply{margin-left:auto;background:var(--accent);color:var(--accent-ink);height:30px;padding:0 12px;border-radius:9px;font-weight:600;font-size:12.5px;flex-shrink:0}
.modechip{margin:0 12px 10px;padding:4px 11px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.modechip:active{background:var(--accent-soft);color:var(--accent)}
.modelist{display:flex;flex-direction:column;gap:2px}
.modeopt{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 12px;border-radius:12px}
.modeopt.on{background:var(--accent-soft)}
.deload-badge{display:inline-block;vertical-align:middle;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--good);background:var(--good-soft);padding:2px 8px;border-radius:8px;margin-left:6px}

/* Stats */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.stat{padding:15px 16px}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:"Archivo";font-weight:800;font-size:27px;letter-spacing:-.02em;margin-top:5px;line-height:1}
.stat .v small{font-size:14px;font-weight:600;color:var(--ink-3);margin-left:3px}

/* bar chart */
.chart{display:flex;align-items:flex-end;gap:7px;height:132px;padding:6px 2px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .3s}
.bar.z{background:var(--line)}
.bar-lb{font-size:10px;color:var(--ink-3);font-weight:600}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head h3{font-size:17px}
.cal-head .icon-btn{font-size:26px;color:var(--ink);background:var(--surface-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-3);padding-bottom:4px}
.cal-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;color:var(--ink-2);position:relative;background:transparent}
.cal-cell.pad{color:transparent}
.cal-cell.today{outline:1.5px solid var(--accent);color:var(--ink)}
.cal-cell.has{background:var(--accent);color:var(--accent-ink)}
.cal-cell.has.sel,.cal-cell.sel{outline:2px solid var(--ink)}

/* session cards / detail */
.sess{padding:14px 16px;margin-bottom:11px}
.sess-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sess-date{font-family:"Archivo";font-weight:700;font-size:15px}
.sess-meta{display:flex;gap:14px;margin-top:9px;font-size:12.5px;flex-wrap:wrap}
.sess-meta b{font-family:"IBM Plex Mono";font-weight:600;color:var(--ink)}
.sess-ex{margin-top:11px;display:flex;flex-direction:column;gap:3px}
.sess-ex div{font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:12px}
.sess-ex .s{font-family:"IBM Plex Mono";color:var(--ink-3);flex-shrink:0}

/* sheet / modal */
.scrim{position:fixed;inset:0;bottom:calc(-1 * var(--deficit));z-index:50;background:rgba(10,14,20,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
/* Closed sheet MUST be visibility:hidden, not just translated off-screen: at launch iOS paints the
   region below the short layout viewport, and the parked white sheet showed there as a white strip
   under the tab bar (confirmed by screenshot, v0.8.6). visibility transitions after the slide-out. */
.sheet{position:fixed;left:0;right:0;bottom:calc(-1 * var(--deficit));max-width:560px;margin:0 auto;z-index:51;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(101%);visibility:hidden;transition:transform .28s cubic-bezier(.32,.72,0,1),visibility 0s .28s;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .28s cubic-bezier(.32,.72,0,1),visibility 0s}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:18px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:16px 18px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet-x{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}

/* misc */
.list{overflow:hidden}
.spacer{height:8px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.instr{font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b) - var(--deficit));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:.25s;box-shadow:var(--shadow);pointer-events:none;white-space:nowrap;display:flex;align-items:center;gap:16px;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.act{pointer-events:auto}
.toast button{color:var(--accent);font-weight:700;font-size:14px;padding:0;letter-spacing:.02em}
.cdialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;width:min(340px,86vw);box-shadow:0 24px 70px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.cdialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.cdialog h3{font-size:18px}
.cdialog p{margin:8px 0 20px;font-size:14px;line-height:1.5}
.cd-btns{display:flex;gap:10px}
.cd-btns .btn{flex:1;height:46px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;min-height:32px}
.backbtn{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:15px;color:var(--ink-2);padding:6px 8px 6px 0}
.backbtn svg{width:20px;height:20px}
.resume{width:100%;text-align:left;padding:15px;margin-top:16px;display:flex;align-items:center;gap:13px;border:1.5px solid var(--accent);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.resume:active{transform:scale(.99)}
.tri{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.routine{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface);margin-bottom:9px}
.routine .ex-ic{width:38px;height:38px}
.routine .del{margin-left:auto;color:var(--ink-3);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
/* rest timer */
.restbar{position:fixed;left:0;right:0;bottom:calc(74px + var(--safe-b) - var(--deficit));transform:translateZ(0);z-index:40;display:none}
.restbar.on{display:block}
.restbar .inner{max-width:520px;margin:0 auto;padding:0 12px}
.restbar .rcard{background:var(--ink);color:var(--bg);border-radius:14px;padding:9px 12px;display:flex;align-items:center;gap:11px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.restbar.done .rcard{background:var(--good);color:#fff}
.rest-time{font-family:"IBM Plex Mono";font-weight:600;font-size:19px;min-width:52px}
.rest-lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:1px}
.rest-prog{flex:1;height:6px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.rest-prog span{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s linear}
.restbar.done .rest-prog span{background:#fff}
.rest-btn{background:rgba(255,255,255,.16);color:inherit;height:34px;padding:0 12px;border-radius:9px;font-weight:600;font-size:13px;flex-shrink:0}
.rest-btn:active{background:rgba(255,255,255,.28)}
/* toggle switch + steppers */
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex-shrink:0;transition:background .15s}
.sw.on{background:var(--good)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on::after{left:23px}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:10px;padding:3px}
.stepper button{width:34px;height:32px;border-radius:8px;font-size:18px;color:var(--ink-2);font-weight:500}
.stepper button:active{color:var(--accent)}
.stepper .val{min-width:52px;text-align:center;font-weight:600}
.cloud{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.cloud .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.cloud.synced .dot{background:var(--good)}
.cloud.local .dot{background:var(--warn)}
.cloud.err .dot{background:#d33a26}
.settingrow{display:flex;align-items:center;justify-content:space-between;padding:15px 2px;border-bottom:1px solid var(--line);gap:12px}
.settingrow:last-child{border:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{padding:7px 15px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* standalone: let the blurred header run under the status bar */
.app-head{padding-top:env(safe-area-inset-top,0px)}
</style>
</head>

function absorbRemote(remote,opts){

  const t=applyTombstones(state.sessions,state.deleted,remote.deleted);
  state.sessions=t.sessions;state.deleted=pruneTombstones(t.tomb);if(t.changed)changed=true;
  const m=mergeSessions(state.sessions,remote.sessions,state.deleted);
  state.sessions=m.merged;if(m.changedLocal)changed=true;if(m.pushNeeded)pushNeeded=true;
  // routines: same rule, tombstoned under r:<id>
  const rt=applyTombstones(state.routines.map(r=>Object.assign({},r,{id:'r:'+r.id})),{},remote.deleted).sessions.map(r=>Object.assign({},r,{id:r.id.slice(2)}));
  if(rt.length!==state.routines.length)changed=true;
  const rm=mergeSessions(rt,(remote.routines||[]).filter(r=>!state.deleted['r:'+r.id]),{});
  state.routines=rm.merged.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));if(rm.changedLocal)changed=true;if(rm.pushNeeded)pushNeeded=true;
  if(remote.settings&&(remote.settings.settingsUpdatedAt||0)>(state.settings.settingsUpdatedAt||0)){
    state.settings=Object.assign(state.settings,remote.settings);state.settings.rest=Object.assign({auto:true,sound:true,notify:false,compound:120,isolation:75},state.settings.rest||{});changed=true;
  }else if((state.settings.settingsUpdatedAt||0)>((remote.settings&&remote.settings.settingsUpdatedAt)||0))pushNeeded=true;
  if(!opts.skipActive){
    const r=IL.sync.resolveActive({active:state.active,activeClearedAt:state.activeClearedAt},{active:remote.active,activeClearedAt:remote.activeClearedAt});
    if(r.changed){state.active=r.active;state.activeClearedAt=r.activeClearedAt;changed=true;}
    if(r.pushNeeded)pushNeeded=true;
  }
  saveSessions();saveRoutines();saveDeleted();saveSettings();saveActive();
  return {changed,pushNeeded};
}
function importBackup(json){
  const d=parseImport(json);const before=state.sessions.length;
  // If the backup was recorded in a different unit, convert its weights to the current unit first —
  // otherwise kg numbers would show as lb (or vice versa).
  const fromUnit=d.settings&&d.settings.unit,toUnit=state.settings.unit;
  if(fromUnit&&toUnit&&fromUnit!==toUnit&&IL.prog&&IL.prog.convertSessions)IL.prog.convertSessions(d.sessions,fromUnit,toUnit,Date.now());
  const r=absorbRemote({sessions:d.sessions,routines:d.routines,deleted:{},settings:null,active:null},{skipActive:true});
  d.sessions.forEach(s=>{state.dirty.add(s.id);});saveDirty();
  if(state.cloud){state.cloud.flush();}
  emit();
  return state.sessions.length-before;
}

/* ---- cloud adapters ----
   Both backends (artifact DB, Dropbox file) implement the SAME shape:
     {name, init():Promise<bool>, pushSession, deleteSession, pushRoutine, deleteRoutine,
      pushSettings, pushActive, flush, syncNow}
   The contract: an adapter only MOVES BYTES to/from its backend. It must never merge — absorbRemote()
   is the single source of merge truth (tombstones, active, settings, routines). A new backend
   implements the methods above and routes incoming remote data through absorbRemote(); it adds no
   merge logic of its own. (Phase 7 makes the artifact adapter obey this — today it still inlines a
   merge in onSnapshot.) */
function artifactAdapter(){
  let db=null;
  const A={name:'artifact',
    async init(){
      db=await claude.use('db');if(!db)return false;
      try{const snap=await db.doc('settings/app').get();if(snap.exists){const rs=cleanSettings(snap.data())||{};
        if((rs.settingsUpdatedAt||0)>(state.settings.settingsUpdatedAt||0)){state.settings=Object.assign(state.settings,rs);saveSettings();}
        else if((state.settings.settingsUpdatedAt||0)>(rs.settingsUpdatedAt||0))A.pushSettings();}}catch(e){}
      try{const snap=await db.doc('active/current').get();
        if(snap.exists){const raw=snap.data();
          const remoteTs=(raw&&raw.updatedAt)||0,localTs=state.active?(state.active.updatedAt||0):(state.activeClearedAt||0);
          if(raw&&raw.id&&remoteTs>localTs){state.active=cleanSession(raw);saveActive();}                                    // remote has a newer active
          else if(raw&&raw.empty&&remoteTs>localTs&&state.active){state.active=null;state.activeClearedAt=Math.max(state.activeClearedAt||0,remoteTs);saveActive();}  // remote ended a workout more recently → don't resurrect it
          else if(localTs>remoteTs)A.pushActive();
        }else if(state.active)A.pushActive();}catch(e){}
      await A.flush();
      db.collection('sessions').onSnapshot(qs=>{
        const remote=[];qs.docs.forEach(d=>{const data=d.data();if(data){data.id=d.id;remote.push(cleanSession(data));}});
        const t=applyTombstones(state.sessions,state.deleted,{});
        const m=mergeSessions(state.sessions,remote,state.deleted);
        // sessions we deleted locally but the cloud still has → delete there too
        remote.forEach(r=>{if(state.deleted[r.id]&&state.deleted[r.id]>=(r.updatedAt||0))db.doc('sessions/'+r.id).delete().catch(()=>{});});
        if(m.changedLocal){state.sessions=m.merged;saveSessions();emit();}
        state.lastSync=Date.now();emit();
      },()=>{});
      db.collection('routines').onSnapshot(qs=>{
        const remote=[];qs.docs.forEach(d=>{const data=d.data();if(data){data.id=d.id;remote.push(cleanRoutine(data));}});
        const m=mergeSessions(state.routines,remote,{});
        remote.forEach(r=>{if(state.deleted['r:'+r.id])db.doc('routines/'+r.id).delete().catch(()=>{});});
        if(m.changedLocal){state.routines=m.merged.filter(r=>!state.deleted['r:'+r.id]).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));saveRoutines();emit();}
      },()=>{});
      return true;
    },
    async pushSession(s){try{await db.doc('sessions/'+s.id).set(s);state.dirty.delete(s.id);saveDirty();state.lastSync=Date.now();state.cloudError='';emit();}catch(e){state.cloudError='Sync failed';emit();}},
    deleteSession(id){db.doc('sessions/'+id).delete().catch(()=>{});},
    pushSettings(){db.doc('settings/app').set(state.settings).catch(()=>{});},
    pushRoutine(r){db.doc('routines/'+r.id).set(r).catch(()=>{});},
    deleteRoutine(id){db.doc('routines/'+id).delete().catch(()=>{});},
    pushActive(){db.doc('active/current').set(state.active||{empty:true,updatedAt:state.activeClearedAt||Date.now(),activeClearedAt:state.activeClearedAt||Date.now()}).catch(()=>{});},
    async flush(){for(const id of [...state.dirty]){const s=state.sessions.find(x=>x.id===id);if(s)await A.pushSession(s);else{state.dirty.delete(id);saveDirty();}}},
    syncNow(){return A.flush();}
  };
  return A;
}
function dropboxAdapter(){
  const D=IL.dropbox;let timer=null,rev=lsGet(LS.dbxRev,null);
  function schedule(){clearTimeout(timer);timer=setTimeout(()=>A.syncNow(),4000);}
  const A={name:'dropbox',
    async init(){
      try{await D.handleRedirect();}catch(e){state.cloudError=e.message;}
      if(!D.isConnected())return false;
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')A.syncNow();});
      window.addEventListener('online',()=>A.syncNow());
      await A.syncNow();
      return true;
    },
    pushSession(){schedule();},deleteSession(){schedule();},pushSettings(){schedule();},pushRoutine(){schedule();},deleteRoutine(){schedule();},pushActive(){schedule();},
    flush(){return A.syncNow();},
    async syncNow(){
      if(state.syncing||!D.isConnected()){if(state.syncing)A._pending=true;return;}   // a sync requested mid-flight re-runs once
      state.syncing=true;state.cloudError='';emit();
      const guard=setTimeout(()=>{state.syncing=false;emit();},30000);   // never wedge if a request hangs
      try{
        const meta=await D.getMetadata();
        let pushNeeded=state.dirty.size>0;
        if(meta&&meta.rev!==rev){
          const f=await D.download();
          if(f){try{const remote=parseImport(f.text);const r=absorbRemote({sessions:remote.sessions,routines:remote.routines,deleted:remote.deleted,settings:remote.settings,active:remote.active,activeClearedAt:remote.activeClearedAt});
            if(r.changed)emit();if(r.pushNeeded)pushNeeded=true;}catch(e){pushNeeded=true;}
            rev=f.rev;}
        }
        if(!meta||pushNeeded||meta.rev!==rev){
          const pushIds=[...state.dirty];   // snapshot BEFORE the await, so sessions logged mid-upload aren't wrongly cleared
          rev=await D.upload(JSON.stringify(exportPayload(state,CFG.VERSION)));
          pushIds.forEach(id=>state.dirty.delete(id));saveDirty();
        }
        lsSet(LS.dbxRev,rev);state.lastSync=Date.now();
      }catch(e){state.cloudError=e.message||'Sync failed';}
      clearTimeout(guard);state.syncing=false;emit();
      if(A._pending){A._pending=false;return A.syncNow();}
    }
  };
  return A;
}
async function initCloud(){
  try{
    if(CFG.DEMO){state.cloudName='none';emit();return;}
    if(typeof window!=='undefined'&&window.claude&&claude.use){

    }
  }catch(e){state.cloudError=e.message||'';}

}

const SCHEMA=1;
function newSession(exIds,deload,volumeBump){const s={id:S.uid(),schema:SCHEMA,date:Date.now(),updatedAt:Date.now(),completed:false,exercises:(exIds||[]).map(id=>B.seedExercise(id,state.sessions,{unit:U(),deload,extraSet:volumeBump&&volumeBump.indexOf(id)>=0}))};if(deload)s.deload=true;return s;}
// The ONLY way a workout begins. spec: {ids, deload, msg, volumeBump, source}. Every start path —
// build / blank / repeat / routine / history-repeat — routes through here, so the draft reset (and,
// from Phase 1, the discard guard) live in one place instead of at each call site.
function startSession(spec){
  spec=spec||{};
  const begin=()=>{
    S.setActive(newSession(spec.ids||[],!!spec.deload,spec.volumeBump));
    resetDraft();
    todayScreen='active';render();
    if(spec.msg)toast(spec.msg);
  };
  // Guard: don't silently overwrite a workout that already has logged sets (Repeat/Routine/Build).
  if(spec.source!=='add'&&state.active&&setsOf(state.active)>0){
    showConfirm('Discard the workout in progress?','Your current workout has logged sets. Starting a new one will discard them.','Discard & start',begin);
    return;
  }
  begin();
}
// Equipment picker for a logged exercise. Changing it re-scopes progression/PRs to that modality
// (see modeOf/lastPerf); entered sets are kept (you're relabelling how it was done, not clearing it).
// The choice is stored only when it differs from the exercise's native equipment, so data stays clean.
function openModePicker(ei){
  const t=cur();if(!t||!t.exercises[ei])return;const ex=t.exercises[ei];const native=EX[ex.id]?EQUIP_MODE[EX[ex.id].equip]:'barbell';const curMode=modeOf(ex);
  openSheet('How did you do it?',`<div class="dim" style="font-size:13px;margin:-4px 2px 14px">Progress and PRs are tracked separately for each — a Smith press won’t be compared to dumbbells.</div>
    <div class="modelist">${MODE_ORDER.map(m=>`<button class="ex-row modeopt ${m===curMode?'on':''}" data-pickmode="${m}">
      <div style="flex:1;min-width:0"><div class="ex-name">${esc(MODES[m].label)}${m===native?' <span class="dim" style="font-weight:400;font-size:11px">· default</span>':''}</div>
      <div class="ex-sub">${MODES[m].perHand?'Enter the weight of one dumbbell':MODES[m].e1rm?'Free-weight loading':'Stack / cable — shown as load, not a 1RM'}</div></div>
      ${m===curMode?'<span style="color:var(--accent);font-size:18px">✓</span>':''}</button>`).join('')}</div>`);
  $('#sheetBody').querySelectorAll('[data-pickmode]').forEach(b=>b.addEventListener('click',()=>{
    const m=b.dataset.pickmode;if(m===native)delete ex.mode;else ex.mode=m;
    persistCur();closeSheet();render();toast(MODES[m].label);}));
}
function buildAndStart(fresh){
  const dl=draft.deload;
  // Coach's findings feed the builder (Phase C). The engine ignores them on a deload (recovery isn't
  // the time to add volume/coverage), so we always pass them and let planWorkout decide.
  const hints=A.buildHints(state.sessions,Date.now(),bw());
  const p=B.planWorkout([...draft.groups],state.sessions,null,{fresh,hints,deload:dl});
  let msg='Workout built — adjust anything';
  if(p.deload)msg=p.mode==='continue'?'Deload — same plan, lighter loads, focus on the stretch':'Deload built — lighter loads, focus on the stretch';
  else if(p.mode==='continue'){
    const gapAdd=(p.reactions||[]).find(r=>r.type==='gap-add');
    if(p.rotation&&p.rotation.anchor)msg=`Swapped ${EX[p.rotation.from].name} → ${EX[p.rotation.to].name} — it stalled through a deload`;
    else if(p.rotation)msg=`Plan continued · swapped ${EX[p.rotation.from].name} → ${EX[p.rotation.to].name} (it stalled)`;
    else if(gapAdd)msg=`Plan continued · added ${EX[gapAdd.exId].name} — ${gapAdd.why}`;
    else if(p.volumeBump&&p.volumeBump.length)msg='Plan continued · +1 set where your volume was low';
    else msg='Plan continued — weights progressed from last time';
  }
  startSession({ids:p.ids,msg,deload:p.deload,volumeBump:p.volumeBump,source:'build'});
}

function logExercise(s,e,ei,mode){

    const histBest=P.bestE1rmBefore(state.sessions,e.id,{mode:emode,bw:bw(),excludeId:s.id});
    if(histBest>0){let best=0,bs=null;e.sets.forEach(st=>{if(st.warm||!P.isWorking(st))return;const est=P.e1rm(P.setLoad(e.id,st.w,bw()),+st.r||0);if((+st.r)&&est>best){best=est;bs=st;}});
      if(bs&&best>histBest)prLine=`<div class="sugg" style="color:var(--good);background:var(--good-soft)"><span>★ New PR — ${bs.w}${U()}${MODES[emode]&&MODES[emode].perHand?'/ea':''} × ${bs.r} <span class="dim">est ${Math.round(best)}${U()}</span></span></div>`;}

    <div class="log-ex-head">

      <a class="linkbtn dim" href="${demoURL(e.id)}" target="_blank" rel="noopener noreferrer" style="margin-left:auto;text-decoration:none">▶ Watch demo</a>

function calendar(done){

  for(let d=1;d<=days;d++){const ts=new Date(y,m,d).getTime();

/* Layout diagnostics shown under the version in Settings. Reads the real safe-area insets by
   measuring a probe element (the only reliable way — computed --safe-b just echoes "env(...)").
   If a viewport problem is ever reported again, these numbers say which state iOS is in:
   inset state = insets 0 and inner < screen height; full-bleed = insets real and inner = screen. */
function viewportDiag(){
  try{
    const probe=document.createElement('div');
    // padding for both, not height: with the global border-box sizing, height would be clamped up
    // to the padding and read the top inset twice (that's what v0.8.6's "bottom 62" was)
    probe.style.cssText='position:fixed;left:-9999px;top:0;visibility:hidden;pointer-events:none;width:1px;height:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
    document.body.appendChild(probe);
    const cs=getComputedStyle(probe);
    const b=Math.round(parseFloat(cs.paddingBottom)||0), t=Math.round(parseFloat(cs.paddingTop)||0);
    probe.remove();
    const vv=window.visualViewport;
    return `screen ${screen.width}×${screen.height} · inner ${innerWidth}×${innerHeight}`+(vv?` · visual ${Math.round(vv.height)}`:'')+` · inset top ${t} bottom ${b} · deficit ${viewportDeficit()}`;
  }catch(e){return '';}
}
/* The launch-time viewport bug, handled deterministically. In an installed (standalone) iOS web app
   the layout viewport comes up short of the screen — measured 62px on an iPhone Pro Max: WebKit
   subtracts the top inset from the bottom until a later native layout pass (usually the first
   scroll) corrects it. The region below the short viewport is still painted, so fixed-bottom
   elements just need to be pushed down by exactly that shortfall (--deficit) to land on the true
   screen edge; once WebKit corrects itself the shortfall reads 0 and everything is back to normal.
   Standalone-only on purpose: in a browser tab innerHeight legitimately excludes the toolbars. */
const STANDALONE=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
function viewportDeficit(){
  if(!STANDALONE||innerWidth>innerHeight)return 0;
  const d=Math.round(screen.height-innerHeight);
  return d>0&&d<=120?d:0;
}
const vpLog=[], vpT0=(window.performance&&performance.now())||Date.now();
function vlog(m){const t=((window.performance&&performance.now())||Date.now())-vpT0;vpLog.push(Math.round(t)+'ms '+m);if(vpLog.length>14)vpLog.shift();}
let _lastDeficit=-1;
function syncViewportDeficit(){
  const d=viewportDeficit();
  if(STANDALONE){
    const de=document.documentElement, portrait=innerWidth<=innerHeight;
    // Bar position is derived from screen.height (constant), not the viewport — see .tabbar CSS
    de.style.setProperty('--screen-h',screen.height+'px');
    de.classList.toggle('standalone',portrait);
    // THE trigger for WebKit's launch-time viewport correction (from the v0.8.9 on-device timeline):
    // the document becoming taller than the short viewport — i.e. scrollable. A one-frame nudge was
    // not enough; a taller-than-viewport document that PERSISTS clears it within ~40ms. Keeping the
    // document at least screen-height tall does exactly that in the launch state, and is a no-op
    // once corrected (viewport == screen height, so nothing becomes scrollable).
    de.style.minHeight=portrait?screen.height+'px':'';
  }
  if(d===_lastDeficit)return;
  _lastDeficit=d;
  document.documentElement.style.setProperty('--deficit',d+'px');
  vlog('deficit '+d+' inner '+innerHeight);
}
function watchViewport(){
  syncViewportDeficit();
  ['resize','orientationchange','pageshow','focus','scroll'].forEach(ev=>addEventListener(ev,syncViewportDeficit,{passive:true}));
  document.addEventListener('visibilitychange',syncViewportDeficit);
  if(window.visualViewport)visualViewport.addEventListener('resize',syncViewportDeficit);
  // WebKit's correction fires no event we can hook, so check every frame while the page is visible
  // (one subtraction per frame — free). A frame-level check means the bar can never be visibly
  // stale for longer than the frame the correction lands in.
  const frame=()=>{if(!document.hidden)syncViewportDeficit();requestAnimationFrame(frame);};
  requestAnimationFrame(frame);
  addEventListener('touchstart',()=>vlog('touch'),{passive:true,once:true});
  addEventListener('load',()=>vlog('load'));
}

  if(state.active){state.active.exercises.forEach(e=>e.sets.forEach(st=>{st.w=P.convertWeight(st.w,from,to);}));S.persistActive();}

  state.settings.bodyweight=Math.round(P.convertWeight(bw(),from,to)||0);
  state.settings.unit=to;S.saveSettingsCloud();
  if(state.cloud)state.cloud.flush();
}

/* ---------------- actions ---------------- */
function addExerciseToCur(id){
  // Lazy-inits an active session only when there isn't one — so it never overwrites a workout in
  // progress and needs no discard guard (unlike the start paths that go through startSession()).
  if(todayScreen!=='edit'&&!state.active){S.setActive(newSession([]));}
  const t=cur();
  if(t.exercises.some(x=>x.id===id)){toast('Already added');return;}
  t.exercises.push(B.seedExercise(id,state.sessions,{excludeId:t.id,unit:U()}));
  persistCur();if(todayScreen!=='edit')todayScreen='active';
  if(currentTab!=='today')setTab('today');else render();
  toast(EX[id].name+' added');
}
function reorderCur(){
  const t=cur();if(!t||t.exercises.length<2)return;
  const counts={};t.exercises.forEach(e=>{const g=EX[e.id]&&EX[e.id].group;if(g)counts[g]=(counts[g]||0)+1;});
  const focus=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const map={};t.exercises.forEach(e=>map[e.id]=e);
  t.exercises=B.orderByFatigue(t.exercises.map(e=>e.id),focus).map(id=>map[id]);
  persistCur();render();toast('Ordered for best performance');
}
// Only sets the user actually checked done are saved (see finalizeSets). Edited-but-unticked sets are
// resolved by confirmUnchecked() before this runs.
function cleanSets(s){s.exercises=P.finalizeSets(s.exercises);}
// How many sets were edited (numbers entered/stepped) but never checked off.
function pendingSets(s){return s.exercises.reduce((n,e)=>n+e.sets.filter(st=>st.t&&!st.done).length,0);}
// Before finishing, if there are edited-but-unticked sets, ask whether to keep them. Otherwise they'd
// silently vanish (only done sets save). Two explicit choices; closing the sheet cancels the finish.
function confirmUnchecked(s,commit){
  const pending=pendingSets(s);
  if(!pending){commit();return;}
  const them=pending>1?'them':'it',n=pending+' set'+(pending>1?'s':'');
  openSheet('Unchecked sets',`<div class="dim" style="font-size:13.5px;margin:-2px 2px 15px;line-height:1.5">You entered numbers on ${n} without checking ${them} off. Save ${them} as done, or leave ${them} out of this workout?</div>
    <button class="btn primary block" id="finSaveAll" style="margin-bottom:9px">Save ${them} as done</button>
    <button class="btn ghost block" id="finLeaveOut">Leave ${them} out</button>`);
  const go=markDone=>{closeSheet();if(markDone)s.exercises.forEach(e=>e.sets.forEach(st=>{if(st.t&&!st.done)st.done=true;}));commit();};
  const a=$('#finSaveAll'),b=$('#finLeaveOut');if(a)a.addEventListener('click',()=>go(true));if(b)b.addEventListener('click',()=>go(false));
}
// Recap of a just-finished session, computed BEFORE it's saved (so history = prior sessions).
function workoutSummary(s){
  const prs=[];
  s.exercises.forEach(e=>{const emode=modeOf(e);const histBest=P.bestE1rmBefore(state.sessions,e.id,{mode:emode,bw:bw(),excludeId:s.id});if(histBest<=0)return;
    let best=0,bs=null;e.sets.forEach(st=>{if(st.warm||!P.isWorking(st))return;const est=P.e1rm(P.setLoad(e.id,st.w,bw()),+st.r||0);if((+st.r)&&est>best){best=est;bs=st;}});
    if(bs&&best>histBest)prs.push({name:EX[e.id]?EX[e.id].name:e.name,w:bs.w,r:bs.r,perHand:MODES[emode]&&MODES[emode].perHand});});
  return {sets:setsOf(s),vol:volOf(s),prs,deload:!!s.deload};
}
function showSummary(sm){
  let body=`<div class="statgrid" style="margin:2px 0 14px">
      <div class="card stat"><div class="k">Working sets</div><div class="v mono">${sm.sets}</div></div>
      <div class="card stat"><div class="k">Volume</div><div class="v mono">${fmtVol(sm.vol)}<small>${U()}</small></div></div></div>`;
  if(sm.deload){
    body+=`<div class="card" style="padding:14px 15px;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent)"><div style="color:var(--good);font-weight:600;font-size:13.5px">🌿 Recovery in the bank</div><div class="dim" style="font-size:12.5px;margin-top:3px">Fatigue's clearing — ease back to full loads when you feel fresh. This won't affect your progression.</div></div>`;
  }else if(sm.prs.length){
    body+=`<div class="eyebrow" style="margin:2px 2px 8px">🎉 New personal record${sm.prs.length>1?'s':''}</div>
      <div class="card list">${sm.prs.map(p=>`<div class="ex-row"><span style="color:var(--good);font-size:18px;flex-shrink:0">★</span><div style="flex:1;min-width:0"><div class="ex-name">${esc(p.name)}</div><div class="ex-sub">${p.w}${U()}${p.perHand?'/ea':''} × ${p.r}</div></div></div>`).join('')}</div>`;
  }else{
    body+=`<div class="dim" style="font-size:13.5px;line-height:1.5;padding:0 2px">Logged and saved. Consistency is what moves the numbers — every session counts.</div>`;
  }
  body+=`<button class="btn primary block" id="sumDone" style="margin-top:16px">Done</button>`;
  openSheet(sm.deload?'Recovery logged 🌿':(sm.prs.length?'New PR! 💪':'Workout complete 💪'),body);
  const d=$('#sumDone');if(d)d.addEventListener('click',()=>{closeSheet();setTab('history');});
}
function finishWorkout(){
  const s=state.active;
  confirmUnchecked(s,()=>{
    stopRest();
    cleanSets(s);
    if(!s.exercises.length){toast('Log at least one set first');return;}
    const sm=workoutSummary(s);
    s.completed=true;s.updatedAt=Date.now();
    S.upsertSession(s,false);state.active=null;S.persistActive();todayScreen='home';
    render();showSummary(sm);
  });
}
function startEdit(s){editSession=JSON.parse(JSON.stringify(s));editDirty=false;todayScreen='edit';setTab('today');}

/* ---------------- bind ---------------- */
function bindClick(sel,fn){const el=$(sel);if(el)el.addEventListener('click',fn);}
// Delegated view actions: a click on any element carrying data-action="name" (or inside one) runs
// ACTIONS[name](el, ev). One listener on #view covers every view and survives re-renders, so a new
// button is just markup + a table row — no per-view rebinding. (The editor, sheets and bindLog keep
// their own handlers; those are scoped to regions that change wholesale.)
const ACTIONS={
  startFlow:()=>{todayScreen='start';render();},
  resume:()=>{todayScreen='active';render();},
  goLibrary:()=>setTab('library'),
  backHome:()=>leaveEditor(),
  build:()=>buildAndStart(false),
  buildFresh:()=>buildAndStart(true),
  coachNudge:el=>{draft.groups=new Set(el.dataset.groups.split(','));render();},
  preset:el=>{const p=PRESETS.find(x=>x.label===el.dataset.preset);if(!p)return;
    draft.groups=presetOn(p)?new Set():new Set(p.groups);   // tap to select those groups; tap again to clear
    render();},
  blank:()=>startSession({ids:[],msg:draft.deload?'Deload — lighter loads, focus on the stretch':null,deload:draft.deload,source:'blank'}),
  deloadToggle:el=>{draft.deload=!draft.deload;el.classList.toggle('on',draft.deload);refreshBuildBtns();}
};
function bind(){

  if(!v.__delegated){v.__delegated=true;v.addEventListener('click',e=>{
    const a=e.target.closest('[data-action]');if(a&&ACTIONS[a.dataset.action]){ACTIONS[a.dataset.action](a,e);return;}
    const sc=e.target.closest('[data-sess]');if(sc){openSessionDetail(sc.dataset.sess);return;}   // works from Home's last-session card AND History
  });}
  const gp=$('#groupPick');if(gp)gp.addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;const g=b.dataset.g;draft.groups.has(g)?draft.groups.delete(g):draft.groups.add(g);b.classList.toggle('on');

  v.querySelectorAll('[data-repeat]').forEach(b=>b.addEventListener('click',()=>{const s=state.sessions.find(x=>x.id===b.dataset.repeat);if(s)startSession({ids:s.exercises.map(e=>e.id),msg:draft.deload?'Deload — same exercises, lighter loads':'Loaded — weights prefilled from history',deload:draft.deload,source:'repeat'});}));
  v.querySelectorAll('[data-routine]').forEach(el=>el.addEventListener('click',e=>{
    if(e.target.closest('[data-delroutine]'))return;
    const r=state.routines.find(x=>x.id===el.dataset.routine);if(r)startSession({ids:r.exIds,msg:draft.deload?r.name+' — deload (lighter loads)':r.name+' loaded',deload:draft.deload,source:'routine'});}));
  v.querySelectorAll('[data-delroutine]').forEach(b=>b.addEventListener('click',()=>{
    const r=state.routines.find(x=>x.id===b.dataset.delroutine);if(!r)return;
    showConfirm('Delete routine?',r.name+' will be removed.','Delete',()=>{const copy=Object.assign({},r);S.deleteRoutine(r.id);render();toast('Routine deleted',{label:'Undo',fn:()=>{S.saveRoutine(copy);render();}});});}));
  // editor
  bindClick('#btnAddEx',openAddExercise);
  const sg=v.querySelector('[data-suggest]');if(sg)sg.addEventListener('click',()=>addExerciseToCur(sg.dataset.suggest));
  bindClick('#btnReorder',reorderCur);
  bindClick('#btnSaveRoutine',()=>saveAsRoutine(cur()));
  bindClick('#btnFinish',finishWorkout);
  bindClick('#btnSaveEdit',finishEdit);
  bindClick('#btnDiscard',()=>showConfirm('Discard workout?','Nothing from this session will be saved.','Discard',()=>{
    stopRest();const copy=state.active;state.active=null;S.persistActive();todayScreen='home';render();
    toast('Workout discarded',{label:'Undo',fn:()=>{S.setActive(copy);todayScreen='active';render();}});}));
  const ll=$('#logList');if(ll)bindLog(ll);

  v.querySelectorAll('[data-mon]').forEach(b=>b.addEventListener('click',()=>{calMonth+=+b.dataset.mon;selDay=null;render();}));
  // [data-sess] is handled by the delegated #view listener above (fires from History AND the Home card).
  // progress: PR rows open the lift's detail (with its progress trend)
  const prc=$('#prCard');if(prc)prc.addEventListener('click',e=>{const r=e.target.closest('[data-openex]');if(r&&EX[r.dataset.openex])openSheet(EX[r.dataset.openex].name,exerciseDetail(r.dataset.openex));});

  v.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',e=>{

function bindLog(root){

      if(st.done&&todayScreen==='active'&&state.settings.rest.auto&&!st.warm)startRest(restSecondsFor(t.exercises[ei].id));persistCur();render();return;}
    const wm=e.target.closest('[data-warm]');if(wm){const ei=+wm.dataset.warm,si=+wm.dataset.s;const st=t.exercises[ei].sets[si];st.warm=!st.warm;persistCur();render();toast(st.warm?'Marked as warm-up':'Counted as a working set');return;}
    const step=e.target.closest('[data-step]');if(step){const ei=+step.dataset.ei,si=+step.dataset.s,f=step.dataset.step,d=+step.dataset.d;const st=t.exercises[ei].sets[si];let v=+st[f]||0;v+=f==='w'?d*inc():d;if(v<0)v=0;st[f]=v;st.t=1;persistCur();const inp=$(`input[data-f="${f}"][data-ei="${ei}"][data-s="${si}"]`);if(inp)inp.value=v;return;}
    const add=e.target.closest('[data-addset]');if(add){const ei=+add.dataset.addset;const sets=t.exercises[ei].sets;const last=sets[sets.length-1]||{w:'',r:''};sets.push({w:last.w,r:last.r,done:false});persistCur();render();return;}
    const rem=e.target.closest('[data-delset]');if(rem){const ei=+rem.dataset.delset;const sets=t.exercises[ei].sets;if(sets.length<=1)return;

        toast('Set removed',{label:'Undo',fn:()=>{const c=cur();if(c&&c.exercises[ei]){c.exercises[ei].sets.splice(idx,0,removed);persistCur();render();}}});};
      if(sets[idx].done)showConfirm('Remove last set?','That set is marked done — remove it anyway?','Remove',doRemove);else doRemove();return;}
    const del=e.target.closest('[data-delex]');if(del){const ei=+del.dataset.delex;const removed=t.exercises.splice(ei,1)[0];persistCur();render();
      toast(removed.name+' removed',{label:'Undo',fn:()=>{const c=cur();if(c){c.exercises.splice(ei,0,removed);persistCur();render();}}});return;}
    const kw=e.target.closest('[data-keepw]');if(kw){const ei=+kw.dataset.keepw;const ex=t.exercises[ei];const lp=P.lastPerf(state.sessions,ex.id,{beforeTs:t.date,excludeId:t.id,mode:modeOf(ex)});
      if(lp)ex.sets=lp.sets.map(s=>({w:s.w,r:s.r,done:false}));persistCur();render();toast('Using last time’s weights');return;}
    const mc=e.target.closest('[data-mode]');if(mc){openModePicker(+mc.dataset.mode);return;}
    const oe=e.target.closest('[data-openex]');if(oe){if(EX[oe.dataset.openex])openSheet(EX[oe.dataset.openex].name,exerciseDetail(oe.dataset.openex));return;}
  });
  root.addEventListener('input',e=>{const inp=e.target.closest('input[data-f]');if(!inp)return;const t=cur();if(!t)return;
    const ei=+inp.dataset.ei,si=+inp.dataset.s,f=inp.dataset.f;const val=P.parseWeightInput(inp.value);
    if(val!==inp.value)inp.value=val;   // reflect the sanitized value back (e.g. "12,5" -> "12.5")
    const st=t.exercises[ei].sets[si];st[f]=val===''?'':(f==='r'?parseInt(val)||val:parseFloat(val)||val);
    st.t=1;   // edited but not necessarily ticked — Finish will ask before dropping it
    persistCur();});
}

/* ---------------- rest timer ---------------- */
let restState=null,restInt=null,audioCtx=null;
function unlockAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function beep(){
  if(!state.settings.rest.sound)return;
  try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
    [0,0.22,0.44].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=i===2?1046:784;o.type='sine';o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.35,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.18);o.start(t+d);o.stop(t+d+0.2);});
  }catch(e){}
}
function restSecondsFor(exId){const ex=EX[exId];const r=state.settings.rest;return ex?(ex.type===C?r.compound:r.isolation):90;}
function startRest(seconds){
  if(!seconds||seconds<5)return;
  restState={total:seconds,end:Date.now()+seconds*1000};
  const bar=$('#restbar');bar.classList.add('on');bar.classList.remove('done');$('#restLbl').textContent='Rest';
  clearInterval(restInt);restInt=setInterval(tickRest,300);tickRest();
}
function tickRest(){
  if(!restState)return;
  const rem=Math.max(0,restState.end-Date.now()),s=Math.ceil(rem/1000);
  $('#restTime').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('#restProg').style.width=(100-(rem/(restState.total*1000))*100)+'%';
  if(rem<=0)finishRest();
}
function finishRest(){
  clearInterval(restInt);restInt=null;
  const bar=$('#restbar');bar.classList.add('done');$('#restLbl').textContent='Rest done';$('#restTime').textContent='Go!';$('#restProg').style.width='100%';
  beep();try{if(navigator.vibrate)navigator.vibrate([180,90,180]);}catch(e){}
  if(state.settings.rest.notify&&'Notification'in window&&Notification.permission==='granted'){try{new Notification('Rest complete 💪',{body:'Time for your next set.'});}catch(e){}}
  restState=null;setTimeout(()=>{const b=$('#restbar');if(b.classList.contains('done'))stopRest();},5000);
}
function stopRest(){clearInterval(restInt);restInt=null;restState=null;const b=$('#restbar');b.classList.remove('on','done');}

/* ---------------- boot ---------------- */
function boot(){
  state.sessions.forEach(s=>{if(!s.schema)s.schema=SCHEMA;});   // schema migrations live here
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  $('#sheetClose').addEventListener('click',closeSheet);$('#scrim').addEventListener('click',closeSheet);
  $('#cdCancel').addEventListener('click',closeConfirm);$('#cscrim').addEventListener('click',closeConfirm);
  $('#cdOk').addEventListener('click',()=>{const cb=_confirmCb;closeConfirm();if(cb)cb();});
  $('#sheetBody').addEventListener('click',e=>{const a=e.target.closest('[data-addto]');if(a){addExerciseToCur(a.dataset.addto);closeSheet();}});
  $('#btnSettings').addEventListener('click',openSettings);
  $('#restSkip').addEventListener('click',stopRest);
  $('#restAdd').addEventListener('click',()=>{
    if(!restState){   // during the "Go!" (done) grace state, +15s starts a fresh short rest instead of no-op
      if($('#restbar').classList.contains('done')){restState={total:15,end:Date.now()+15000};$('#restbar').classList.remove('done');$('#restLbl').textContent='Rest';}
      else return;
    }else{restState.end+=15000;restState.total+=15;$('#restbar').classList.remove('done');}
    if(!restInt)restInt=setInterval(tickRest,300);tickRest();});
  document.addEventListener('pointerdown',unlockAudio);
  $('#view').addEventListener('click',e=>{if(e.target.closest('[data-vol-info]'))toast('Volume = weight × reps, added up across your working sets');});
  // re-render on cloud changes, but never yank focus from someone typing a weight
  S.onChange(()=>{updateCloud();const a=document.activeElement;if(a&&a.tagName==='INPUT')return;render();});
  applyTheme();watchViewport();setTab('today');S.initCloud();
  if(state.justSeeded)setTimeout(()=>toast('Sample data loaded — explore every tab'),600);
}
IL.ui={toast,render,setTab,openSettings,boot};
// Last-resort guards: a runtime error in an event handler or a rejected promise should degrade
// quietly, never blank the screen or surface a raw stack to the user.
try{
  window.addEventListener('error',e=>{try{console.error('runtime error',e.error||e.message);}catch(_){}});
  window.addEventListener('unhandledrejection',e=>{try{console.error('unhandled rejection',e.reason);}catch(_){}});
}catch(e){}
try{boot();}catch(err){try{console.error('boot failed',err);}catch(e){}}

})();

</script>
<script>if('serviceWorker' in navigator&&location.hostname!=='localhost'){navigator.serviceWorker.register('./sw.js').then(reg=>{
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{});});
  reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{
    if(nw.state==='installed'&&navigator.serviceWorker.controller){
      try{const ch=new MessageChannel();ch.port1.onmessage=ev=>{if(ev.data&&ev.data.v&&ev.data.v!==(IL.config&&IL.config.VERSION)&&IL.ui)IL.ui.toast('Update ready',{label:'Reload',fn:()=>location.reload()});};nw.postMessage('version',[ch.port2]);}
      catch(e){if(IL.ui)IL.ui.toast('Update ready',{label:'Reload',fn:()=>location.reload()});}
    }});});
}).catch(()=>{});}</script>
