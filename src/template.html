<header class="app-head">
  <div class="wrap">
    <div class="brand"><span class="spark"></span>Ironlog</div>
    <div style="display:flex;align-items:center;gap:4px">
      <span id="cloudStatus" class="cloud local"><span class="dot"></span><span id="cloudText">On this phone</span></span>
      <button class="icon-btn" id="btnSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="view" class="wrap"></main>

<div class="restbar" id="restbar"><div class="inner"><div class="rcard">
  <div><div class="rest-lbl" id="restLbl">Rest</div><span class="rest-time" id="restTime">0:00</span></div>
  <div class="rest-prog"><span id="restProg"></span></div>
  <button class="rest-btn" id="restAdd">+15s</button>
  <button class="rest-btn" id="restSkip">Skip</button>
</div></div></div>

<nav class="tabbar">
  <div class="row">
    <button class="tab" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 6.5v11M17.5 6.5v11M4 9.5v5M20 9.5v5M6.5 12h11"/></svg>Today</button>
    <button class="tab" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>History</button>
    <button class="tab" data-tab="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Library</button>
    <button class="tab" data-tab="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V4M4 20h16M8 20v-6M12 20V9M16 20v-9M20 20v-4"/></svg>Progress</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head"><h3 id="sheetTitle"></h3><button class="sheet-x" id="sheetClose" aria-label="Close">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
<div class="scrim" id="cscrim"></div>
<div class="cdialog" id="cdialog" role="alertdialog" aria-modal="true">
  <h3 id="cdTitle"></h3>
  <p id="cdMsg" class="muted"></p>
  <div class="cd-btns"><button class="btn ghost" id="cdCancel">Cancel</button><button class="btn" id="cdOk"></button></div>
</div>
